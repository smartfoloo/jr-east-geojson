<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JR East GeoJSON Downloads</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Roboto, Helvetica, Arial, sans-serif;
    background: #F7FAFC;
    color: #1A202C;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #3182CE; text-decoration: none; }
  a:hover { color: #2B6CB0; text-decoration: underline; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E0; border-radius: 9px; border: 2px solid #fff; }

  button, a { font-family: inherit; }
  button:focus-visible, a:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, .6);
    border-radius: 6px;
  }

  .wrap { min-height: 100vh; padding: 32px 20px 48px; }

  .lang-picker {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 50;
  }
  .lang-btn {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: #4A5568;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .12s ease;
  }
  .lang-btn:hover { background: #EDF2F7; }
  .lang-btn:active { background: #E2E8F0; }
  .lang-btn svg { pointer-events: none; }

  .lang-menu {
    position: absolute;
    top: 42px;
    right: 0;
    min-width: 152px;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -2px rgba(0, 0, 0, .05);
    padding: 6px;
    opacity: 0;
    transform: translateY(-4px) scale(.97);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity .14s cubic-bezier(.16,1,.3,1), transform .14s cubic-bezier(.16,1,.3,1);
  }
  .lang-menu.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .lang-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    font-weight: 500;
    font-size: 14px;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    color: #4A5568;
    text-align: left;
  }
  .lang-option:hover { background: #EDF2F7; }
  .lang-option:active { background: #E2E8F0; }
  .lang-option.active { color: #2B6CB0; font-weight: 600; }
  .lang-option .check { opacity: 0; color: #3182CE; }
  .lang-option.active .check { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .lang-menu { transition: none; }
  }

  .page-header { max-width: 1120px; margin: 0 auto 24px; }
  .title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
    color: #1A202C;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 15px;
    font-weight: 400;
    color: #718096;
    margin-top: 4px;
  }

  .app {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .06);
  }

  .map-card {
    flex: 0 0 320px;
    position: sticky;
    top: 20px;
    height: 600px;
    overflow: hidden;
  }
  .map-card svg {
    width: 100%;
    height: 100%;
    display: block;
    background: #F7FAFC;
  }
  .map-line {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.5px;
    opacity: .85;
    transition: opacity .15s ease, stroke-width .15s ease;
  }
  .map-line.dim { opacity: .15; }
  .map-line.hot { opacity: 1; stroke-width: 4.5px; }
  .map-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #A0AEC0;
  }

  .content-card { flex: 1; min-width: 0; overflow: hidden; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #E2E8F0;
    flex-wrap: wrap;
  }
  .count {
    font-size: 13px;
    color: #718096;
  }
  .download-all {
    font-weight: 600;
    font-size: 14px;
    height: 36px;
    padding: 0 14px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: #3182CE;
    color: #fff;
    cursor: pointer;
    transition: background .15s ease;
  }
  .download-all:hover { background: #2B6CB0; }
  .download-all:active { background: #2C5282; }

  .table-scroll { overflow-x: auto; }
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .table thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #718096;
    padding: 10px 20px;
    border-bottom: 1px solid #E2E8F0;
    white-space: nowrap;
  }
  .table tbody td {
    padding: 12px 20px;
    border-bottom: 1px solid #EDF2F7;
    vertical-align: middle;
  }
  .table tbody tr:last-child td { border-bottom: none; }
  .table tbody tr.row {
    transition: background .12s ease;
    opacity: 0;
    transform: translateY(2px);
    animation: reveal .3s cubic-bezier(.16, 1, .3, 1) forwards;
  }
  .table tbody tr.row:hover { background: #F7FAFC; }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

  .line-flex { display: flex; align-items: center; gap: 10px; }
  .item-swatch {
    flex: 0 0 auto;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .item-primary {
    color: #1A202C;
    font-weight: 500;
    white-space: nowrap;
  }

  .hexpill {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .03em;
    color: #fff;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .cell-size {
    color: #718096;
    font-size: 13px;
    white-space: nowrap;
  }
  .cell-action { text-align: right; }
  .btn-download {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: #4A5568;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .12s ease;
  }
  .btn-download:hover { background: #EDF2F7; text-decoration: none; }
  .btn-download:active { background: #E2E8F0; }
  .btn-download svg { pointer-events: none; }

  .state-msg {
    text-align: center;
    font-size: 14px;
    color: #718096;
    padding: 40px 0 !important;
    border-bottom: none !important;
  }

  footer {
    max-width: 1120px;
    margin: 24px auto 0;
    text-align: left;
    font-size: 12px;
    color: #A0AEC0;
  }

  @media (max-width: 860px) {
    .app { flex-direction: column; align-items: stretch; }
    .map-card { position: static; width: 100%; height: 260px; flex: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .table tbody tr.row { animation: none; opacity: 1; transform: none; }
    .btn-download, .download-all, .lang-btn { transition: none; }
  }

  /* Japanese uses Hiragino Sans throughout. */
  body.lang-ja, body.lang-ja * {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif !important;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-picker">
    <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
      </svg>
    </button>
    <div class="lang-menu" id="langMenu">
      <button class="lang-option" id="langJa">
        <span>日本語</span><span class="check">✓</span>
      </button>
      <button class="lang-option" id="langEn">
        <span>English</span><span class="check">✓</span>
      </button>
    </div>
  </div>

  <div class="page-header">
    <div class="title" id="pageTitle">JR East GeoJSON</div>
    <div class="subtitle" id="pageSub">路線ごとの GeoJSON ファイルをダウンロードできます</div>
  </div>

  <div class="app">
    <aside class="card map-card">
      <svg id="mapSvg" viewBox="0 0 320 600" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-state" id="mapState">読み込み中…</div>
    </aside>

    <section class="card content-card">
      <div class="toolbar">
        <span class="count" id="lineCount"></span>
        <button class="download-all" id="downloadAll">
          <span id="downloadAllLabel">すべてダウンロード</span>
        </button>
      </div>
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th id="colLine">路線</th>
              <th id="colColor">カラー</th>
              <th id="colSize">サイズ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="grid">
            <tr><td class="state-msg" colspan="4" id="stateMsg">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <footer id="footerNote">GeoJSON files are sourced from this repository.</footer>
</div>

<script>
(function () {
  var GEOJSON_DIR = 'geojson/';
  var MANIFEST_URL = GEOJSON_DIR + 'manifest.json';

  var STRINGS = {
    ja: {
      title: 'JR東日本GeoJSONダウンローダー',
      sub: '路線ごとの GeoJSON ファイルをダウンロードできます',
      downloadAll: 'すべてダウンロード',
      download: 'ダウンロード',
      loading: '読み込み中…',
      error: '路線データの読み込みに失敗しました。',
      footer: 'GeoJSON ファイルはこのリポジトリから提供されています。',
      count: function (n) { return n + ' 路線'; },
      colLine: '路線',
      colColor: 'カラー',
      colSize: 'サイズ'
    },
    en: {
      title: 'JR East GeoJSON',
      sub: 'Download the GeoJSON file for each railway line',
      downloadAll: 'Download all',
      download: 'Download',
      loading: 'Loading…',
      error: 'Failed to load line data.',
      footer: 'GeoJSON files are sourced from this repository.',
      count: function (n) { return n + ' lines'; },
      colLine: 'Line',
      colColor: 'Color',
      colSize: 'Size'
    }
  };

  var state = { lang: 'ja', lines: [] };
  var mapPaths = {};

  var els = {
    title: document.getElementById('pageTitle'),
    sub: document.getElementById('pageSub'),
    langBtn: document.getElementById('langBtn'),
    langMenu: document.getElementById('langMenu'),
    langJa: document.getElementById('langJa'),
    langEn: document.getElementById('langEn'),
    grid: document.getElementById('grid'),
    colLine: document.getElementById('colLine'),
    colColor: document.getElementById('colColor'),
    colSize: document.getElementById('colSize'),
    mapSvg: document.getElementById('mapSvg'),
    mapState: document.getElementById('mapState'),
    count: document.getElementById('lineCount'),
    downloadAll: document.getElementById('downloadAll'),
    downloadAllLabel: document.getElementById('downloadAllLabel'),
    footer: document.getElementById('footerNote')
  };

  function downloadIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 4V15M12 15L7.5 10.5M12 15L16.5 10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M4.5 17.5V18.5C4.5 19.6046 5.39543 20.5 6.5 20.5H17.5C18.6046 20.5 19.5 19.6046 19.5 18.5V17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
      '</svg>';
  }

  function normalizeColor(c) {
    if (!c) return '3182CE';
    return c.charAt(0) === '#' ? c.slice(1) : c;
  }

  function readableTextColor(hex) {
    var r = parseInt(hex.substr(0, 2), 16);
    var g = parseInt(hex.substr(2, 2), 16);
    var b = parseInt(hex.substr(4, 2), 16);
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#1A202C' : '#FFFFFF';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    return (bytes / 1024).toFixed(1) + ' KB';
  }

  function buildProjector(bounds, width, height, padding) {
    var lngSpan = bounds.maxLng - bounds.minLng || 0.001;
    var latSpan = bounds.maxLat - bounds.minLat || 0.001;
    var midLat = (bounds.minLat + bounds.maxLat) / 2;
    var xFactor = Math.cos(midLat * Math.PI / 180);
    var effW = lngSpan * xFactor;
    var effH = latSpan;
    var availW = width - padding * 2;
    var availH = height - padding * 2;
    var scale = Math.min(availW / effW, availH / effH);
    var drawW = effW * scale;
    var drawH = effH * scale;
    var offsetX = (width - drawW) / 2;
    var offsetY = (height - drawH) / 2;
    return function (lng, lat) {
      return [
        offsetX + (lng - bounds.minLng) * xFactor * scale,
        offsetY + (bounds.maxLat - lat) * scale
      ];
    };
  }

  function renderMap(lines) {
    var minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
    lines.forEach(function (line) {
      line.coordinates.forEach(function (ls) {
        ls.forEach(function (pt) {
          if (pt[0] < minLng) minLng = pt[0];
          if (pt[0] > maxLng) maxLng = pt[0];
          if (pt[1] < minLat) minLat = pt[1];
          if (pt[1] > maxLat) maxLat = pt[1];
        });
      });
    });
    var vb = els.mapSvg.viewBox.baseVal;
    var width = vb && vb.width ? vb.width : 320;
    var height = vb && vb.height ? vb.height : 600;
    var project = buildProjector({ minLng: minLng, maxLng: maxLng, minLat: minLat, maxLat: maxLat }, width, height, 24);

    var svgNs = 'http://www.w3.org/2000/svg';
    while (els.mapSvg.firstChild) els.mapSvg.removeChild(els.mapSvg.firstChild);

    lines.forEach(function (line) {
      var d = line.coordinates.map(function (ls) {
        return ls.map(function (pt, i) {
          var p = project(pt[0], pt[1]);
          return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1);
        }).join('');
      }).join(' ');
      var path = document.createElementNS(svgNs, 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'map-line');
      path.setAttribute('stroke', '#' + line.color);
      path.setAttribute('data-file', line.file);
      els.mapSvg.appendChild(path);
    });

    mapPaths = {};
    Array.prototype.forEach.call(els.mapSvg.querySelectorAll('.map-line'), function (p) {
      mapPaths[p.getAttribute('data-file')] = p;
    });
  }

  function highlightLine(file) {
    Object.keys(mapPaths).forEach(function (f) {
      mapPaths[f].classList.toggle('hot', f === file);
      mapPaths[f].classList.toggle('dim', !!file && f !== file);
    });
  }

  function render() {
    var t = STRINGS[state.lang];
    document.documentElement.lang = state.lang;
    document.body.classList.toggle('lang-ja', state.lang === 'ja');
    els.title.textContent = t.title;
    els.sub.textContent = t.sub;
    els.downloadAllLabel.textContent = t.downloadAll;
    els.footer.textContent = t.footer;
    els.colLine.textContent = t.colLine;
    els.colColor.textContent = t.colColor;
    els.colSize.textContent = t.colSize;
    els.langJa.classList.toggle('active', state.lang === 'ja');
    els.langEn.classList.toggle('active', state.lang === 'en');

    if (!state.lines.length) {
      els.grid.innerHTML = '<tr><td class="state-msg" colspan="4">' + (state.error ? t.error : t.loading) + '</td></tr>';
      els.count.textContent = '';
      return;
    }

    els.count.textContent = t.count(state.lines.length);

    els.grid.innerHTML = state.lines.map(function (line, i) {
      var hex = '#' + line.color;
      var textColor = readableTextColor(line.color);
      var primary = state.lang === 'ja' ? line.jaName : line.enName;
      return '' +
        '<tr class="row" data-file="' + line.file + '" style="animation-delay:' + (i * 30) + 'ms">' +
          '<td>' +
            '<span class="line-flex">' +
              '<span class="item-swatch" style="background:' + hex + '"></span>' +
              '<span class="item-primary">' + primary + '</span>' +
            '</span>' +
          '</td>' +
          '<td><span class="hexpill" style="background:' + hex + ';color:' + textColor + '">' + hex.toUpperCase() + '</span></td>' +
          '<td class="cell-size">' + formatSize(line.bytes) + '</td>' +
          '<td class="cell-action">' +
            '<a class="btn-download" href="' + line.file + '" download="' + line.file.split('/').pop() + '" aria-label="' + t.download + '" title="' + t.download + '">' +
              downloadIcon() +
            '</a>' +
          '</td>' +
        '</tr>';
    }).join('');
  }

  function setLang(lang) {
    closeMenu();
    if (state.lang === lang) return;
    state.lang = lang;
    render();
  }

  function openMenu() {
    els.langMenu.classList.add('open');
    els.langBtn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    els.langMenu.classList.remove('open');
    els.langBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleMenu() {
    if (els.langMenu.classList.contains('open')) closeMenu();
    else openMenu();
  }

  els.langBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMenu();
  });
  document.addEventListener('click', function (e) {
    if (!els.langMenu.contains(e.target) && e.target !== els.langBtn) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });

  els.langJa.addEventListener('click', function () { setLang('ja'); });
  els.langEn.addEventListener('click', function () { setLang('en'); });

  els.grid.addEventListener('mouseover', function (e) {
    var row = e.target.closest && e.target.closest('.row');
    if (row) highlightLine(row.getAttribute('data-file'));
  });
  els.grid.addEventListener('mouseout', function (e) {
    var row = e.target.closest && e.target.closest('.row');
    var to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.row');
    if (row && row !== to) highlightLine(null);
  });

  els.downloadAll.addEventListener('click', function () {
    state.lines.forEach(function (line, i) {
      setTimeout(function () {
        var a = document.createElement('a');
        a.href = line.file;
        a.download = line.file.split('/').pop();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, i * 250);
    });
  });

  function geometryToLineStrings(geometry) {
    if (!geometry) return [];
    if (geometry.type === 'MultiLineString') return geometry.coordinates;
    if (geometry.type === 'LineString') return [geometry.coordinates];
    return [];
  }

  function loadLine(filename) {
    var file = GEOJSON_DIR + filename;
    return fetch(file)
      .then(function (res) {
        if (!res.ok) throw new Error('Failed to fetch ' + file);
        return res.text();
      })
      .then(function (text) {
        var bytes = new Blob([text]).size;
        var data = JSON.parse(text);
        var features = data.features || [];
        var props = (features[0] && features[0].properties) || {};
        var coordinates = features.reduce(function (acc, feature) {
          return acc.concat(geometryToLineStrings(feature.geometry));
        }, []);
        return {
          file: file,
          id: props.id || filename,
          jaName: props.ja || props.id || filename,
          enName: props.en || props.id || filename,
          color: normalizeColor(props.color),
          bytes: bytes,
          coordinates: coordinates
        };
      });
  }

  fetch(MANIFEST_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('Failed to fetch ' + MANIFEST_URL);
      return res.json();
    })
    .then(function (filenames) {
      return Promise.all(filenames.map(loadLine));
    })
    .then(function (lines) {
      state.lines = lines;
      render();
      renderMap(lines);
      els.mapState.style.display = 'none';
    })
    .catch(function (err) {
      console.error(err);
      state.error = true;
      render();
      els.mapState.textContent = STRINGS[state.lang].error;
    });

  render();
})();
</script>
</body>
</html>
